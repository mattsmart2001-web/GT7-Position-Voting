<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GT7 Voting Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 42px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .controls {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .control-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .start-btn {
      background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
      color: white;
    }

    .start-btn:hover {
      background: linear-gradient(135deg, #00f094 0%, #00c87b 100%);
    }

    .stop-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
      color: white;
    }

    .stop-btn:hover {
      background: linear-gradient(135deg, #ff8787 0%, #ff6a60 100%);
    }

    .reset-btn {
      background: linear-gradient(135deg, #ffd93d 0%, #f4b942 100%);
      color: #333;
    }

    .reset-btn:hover {
      background: linear-gradient(135deg, #ffe74c 0%, #ffc952 100%);
    }

    .status {
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .status.active {
      background: rgba(0, 255, 100, 0.2);
      border: 2px solid rgba(0, 255, 100, 0.5);
      color: #00ff64;
    }

    .status.inactive {
      background: rgba(255, 100, 100, 0.2);
      border: 2px solid rgba(255, 100, 100, 0.5);
      color: #ff6464;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .stat-value {
      font-size: 48px;
      font-weight: bold;
      color: #ffd93d;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .stat-label {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 10px;
    }

    .results {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .results h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .position-result {
      display: flex;
      align-items: center;
      padding: 15px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 4px solid #ff6b6b;
      transition: all 0.3s ease;
    }

    .position-result:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .position-result.top {
      border-left-color: #ffd93d;
      background: rgba(255, 217, 61, 0.1);
    }

    .position-number {
      font-size: 32px;
      font-weight: bold;
      width: 80px;
      text-align: center;
    }

    .position-bar-container {
      flex: 1;
      height: 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      overflow: hidden;
      margin: 0 20px;
    }

    .position-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b 0%, #ee5a52 100%);
      transition: width 0.5s ease;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: white;
      font-weight: bold;
    }

    .position-bar-fill.top {
      background: linear-gradient(90deg, #ffd93d 0%, #f4b942 100%);
      color: #333;
    }

    .position-count {
      font-size: 24px;
      font-weight: bold;
      width: 60px;
      text-align: center;
    }

    .info-box {
      background: rgba(100, 181, 246, 0.2);
      border: 2px solid rgba(100, 181, 246, 0.5);
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .info-box h3 {
      margin-bottom: 10px;
      color: #64b5f6;
    }

    .info-box code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffd93d;
    }

    .test-vote {
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .test-vote h3 {
      margin-bottom: 15px;
    }

    .test-vote-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .test-vote-form input {
      padding: 10px 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 16px;
      flex: 1;
      min-width: 150px;
    }

    .test-vote-form input:focus {
      outline: none;
      border-color: #64b5f6;
    }

    .submit-vote-btn {
      background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
      color: white;
      padding: 10px 30px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏁 GT7 Position Voting - Admin Panel</h1>

    <div class="controls">
      <div class="status inactive" id="pollStatus">
        Poll Inactive
      </div>

      <div class="control-buttons">
        <button class="start-btn" onclick="startPoll()">▶️ Start Poll</button>
        <button class="stop-btn" onclick="stopPoll()">⏸️ Stop Poll</button>
        <button class="reset-btn" onclick="resetPoll()">🔄 Reset All Votes</button>
      </div>

      <div class="test-vote">
        <h3>Test Vote (for testing)</h3>
        <div class="test-vote-form">
          <input type="text" id="testUsername" placeholder="Username" value="TestUser">
          <input type="number" id="testPosition" placeholder="Position (1-16)" min="1" max="16" value="1">
          <button class="submit-vote-btn" onclick="submitTestVote()">Submit Test Vote</button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalVotes">0</div>
        <div class="stat-label">Total Votes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="uniqueVoters">0</div>
        <div class="stat-label">Unique Voters</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="topPosition">-</div>
        <div class="stat-label">Most Voted Position</div>
      </div>
    </div>

    <div class="results">
      <h2>📊 Live Results</h2>
      <div id="resultsContainer">
        <!-- Results will be populated here -->
      </div>
    </div>

    <div class="info-box">
      <h3>🔗 Setup Instructions</h3>
      <p><strong>OBS Browser Source:</strong> <code>http://localhost:3000/overlay</code></p>
      <p><strong>Size:</strong> 1920x1080</p>
      <p><strong>Streamerbot Command:</strong> Viewers type <code>!vote [1-16]</code> in YouTube chat</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentVoteData = null;

    // Update UI with vote data
    function updateUI(voteData) {
      currentVoteData = voteData;

      // Update status
      const statusEl = document.getElementById('pollStatus');
      if (voteData.pollActive) {
        statusEl.textContent = '🔴 Poll Active - Voting Open';
        statusEl.className = 'status active';
      } else {
        statusEl.textContent = 'Poll Inactive';
        statusEl.className = 'status inactive';
      }

      // Update stats
      document.getElementById('totalVotes').textContent = voteData.totalVotes;
      document.getElementById('uniqueVoters').textContent = Object.keys(voteData.voterMap).length;

      // Find top position
      let topPos = '-';
      let topVotes = 0;
      Object.keys(voteData.votes).forEach(pos => {
        if (voteData.votes[pos].count > topVotes) {
          topVotes = voteData.votes[pos].count;
          topPos = `P${pos}`;
        }
      });
      document.getElementById('topPosition').textContent = topPos;

      // Update results
      const resultsContainer = document.getElementById('resultsContainer');
      resultsContainer.innerHTML = '';

      // Sort positions by vote count
      const sortedPositions = Object.keys(voteData.votes)
        .sort((a, b) => voteData.votes[b].count - voteData.votes[a].count);

      const maxVotes = voteData.votes[sortedPositions[0]]?.count || 1;

      sortedPositions.forEach(pos => {
        const data = voteData.votes[pos];
        const percentage = maxVotes > 0 ? (data.count / maxVotes) * 100 : 0;
        const isTop = data.count === maxVotes && data.count > 0;

        const resultDiv = document.createElement('div');
        resultDiv.className = `position-result ${isTop ? 'top' : ''}`;
        resultDiv.innerHTML = `
          <div class="position-number">P${pos}</div>
          <div class="position-bar-container">
            <div class="position-bar-fill ${isTop ? 'top' : ''}" style="width: ${percentage}%;">
              ${data.count > 0 ? data.count : ''}
            </div>
          </div>
          <div class="position-count">${data.count}</div>
        `;
        resultsContainer.appendChild(resultDiv);
      });
    }

    // Control functions
    function startPoll() {
      socket.emit('startPoll');
    }

    function stopPoll() {
      socket.emit('stopPoll');
    }

    function resetPoll() {
      if (confirm('Are you sure you want to reset all votes? This cannot be undone.')) {
        socket.emit('resetPoll');
      }
    }

    function submitTestVote() {
      const username = document.getElementById('testUsername').value;
      const position = document.getElementById('testPosition').value;

      if (!username || !position) {
        alert('Please enter both username and position');
        return;
      }

      socket.emit('vote', {
        username: username,
        position: parseInt(position),
        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`
      });

      // Increment test user number for next vote
      const match = username.match(/(\d+)$/);
      if (match) {
        const num = parseInt(match[1]) + 1;
        document.getElementById('testUsername').value = username.replace(/\d+$/, num);
      } else {
        document.getElementById('testUsername').value = username + '2';
      }
    }

    // Socket event handlers
    socket.on('voteUpdate', updateUI);
    socket.on('pollStatusChange', (status) => {
      if (currentVoteData) {
        currentVoteData.pollActive = status.active;
        updateUI(currentVoteData);
      }
    });

    socket.on('connect', () => {
      console.log('Connected to server');
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from server');
    });
  </script>
</body>
</html>
