<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GT7 Position Voting Leaderboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 30px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
      border-radius: 15px;
      border: 2px solid rgba(255, 215, 0, 0.3);
    }

    .header h1 {
      font-size: 42px;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .header .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 10px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .leaderboard-table {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .table-header {
      display: grid;
      grid-template-columns: 80px 1fr 120px 150px;
      padding: 20px;
      background: rgba(255, 215, 0, 0.1);
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      font-weight: bold;
      color: #FFD700;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 80px 1fr 120px 150px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
      transition: all 0.3s ease;
    }

    .table-row:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(5px);
    }

    .table-row.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 215, 0, 0.05) 100%);
      border-left: 4px solid #FFD700;
    }

    .table-row.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.15) 0%, rgba(192, 192, 192, 0.05) 100%);
      border-left: 4px solid #C0C0C0;
    }

    .table-row.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.15) 0%, rgba(205, 127, 50, 0.05) 100%);
      border-left: 4px solid #CD7F32;
    }

    .rank-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.6);
    }

    .rank-1 .rank-cell {
      color: #FFD700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .rank-2 .rank-cell {
      color: #C0C0C0;
      text-shadow: 0 0 10px rgba(192, 192, 192, 0.8);
    }

    .rank-3 .rank-cell {
      color: #CD7F32;
      text-shadow: 0 0 10px rgba(205, 127, 50, 0.8);
    }

    .trophy {
      font-size: 28px;
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .username {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    .points-cell {
      font-size: 24px;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .wins-cell {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .empty-message {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      padding: 60px 30px;
      font-size: 18px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .table-row {
      animation: slideIn 0.5s ease-out;
    }

    @media (max-width: 768px) {
      .table-header,
      .table-row {
        grid-template-columns: 60px 1fr 100px;
      }

      .wins-cell {
        display: none;
      }

      .header h1 {
        font-size: 32px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .username {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏆 GT7 PREDICTION LEADERBOARD</h1>
      <div class="subtitle">Complete Rankings - All Time</div>
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-value" id="totalPlayers">0</div>
          <div class="stat-label">Total Players</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="totalPredictions">0</div>
          <div class="stat-label">Total Correct</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="lastUpdate">-</div>
          <div class="stat-label">Last Update</div>
        </div>
      </div>
    </div>

    <div class="leaderboard-table">
      <div class="table-header">
        <div>Rank</div>
        <div>Player</div>
        <div>Points</div>
        <div class="wins-cell">Correct Guesses</div>
      </div>
      <div id="leaderboardBody">
        <div class="empty-message">No predictions yet! Start voting to see the leaderboard.</div>
      </div>
    </div>
  </div>

  <script>
    const LEADERBOARD_FILE = window.location.protocol === 'file:'
      ? 'C:/GT7-Position-Voting/leaderboard.js'
      : 'leaderboard.js';

    let lastUpdateTime = 0;

    function loadLeaderboard() {
      // Remove old script tag
      const oldScript = document.querySelector('script[data-leaderboard]');
      if (oldScript) {
        oldScript.parentNode.removeChild(oldScript);
      }

      window.GT7Leaderboard = [];

      let fileUrl = LEADERBOARD_FILE;
      if (window.location.protocol === 'file:' && !fileUrl.startsWith('file://') && !fileUrl.startsWith('http')) {
        fileUrl = 'file:///' + LEADERBOARD_FILE.replace(/\\/g, '/');
      }

      const script = document.createElement('script');
      script.setAttribute('data-leaderboard', 'true');
      script.type = 'text/javascript';
      script.src = fileUrl + '?v=' + Date.now();

      script.onload = function() {
        if (window.GT7Leaderboard && window.GT7Leaderboard.length > 0) {
          const latestUpdate = Math.max(...window.GT7Leaderboard.map(p => p.lastUpdated || 0));
          if (latestUpdate !== lastUpdateTime) {
            lastUpdateTime = latestUpdate;
            updateDisplay();
            console.log('Leaderboard updated: ' + window.GT7Leaderboard.length + ' players');
          }
        }
      };

      script.onerror = function() {
        console.log('No leaderboard data found yet');
      };

      document.head.appendChild(script);
    }

    function updateDisplay() {
      const body = document.getElementById('leaderboardBody');

      if (!window.GT7Leaderboard || window.GT7Leaderboard.length === 0) {
        body.innerHTML = '<div class="empty-message">No predictions yet! Start voting to see the leaderboard.</div>';
        updateStats(0, 0, '-');
        return;
      }

      // Sort by points (descending), then by name
      const sorted = [...window.GT7Leaderboard].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return a.username.localeCompare(b.username);
      });

      // Calculate stats
      const totalPlayers = sorted.length;
      const totalPredictions = sorted.reduce((sum, p) => sum + p.points, 0);
      const lastUpdate = formatTimestamp(Math.max(...sorted.map(p => p.lastUpdated || 0)));

      updateStats(totalPlayers, totalPredictions, lastUpdate);

      // Display ALL players (not limited to top 10)
      body.innerHTML = sorted.map((player, index) => {
        const rank = index + 1;
        let rankClass = '';
        let trophy = '';

        if (rank === 1) {
          rankClass = 'rank-1';
          trophy = '🥇';
        } else if (rank === 2) {
          rankClass = 'rank-2';
          trophy = '🥈';
        } else if (rank === 3) {
          rankClass = 'rank-3';
          trophy = '🥉';
        }

        const correctGuesses = player.points;
        const plural = correctGuesses === 1 ? 'win' : 'wins';

        return `
          <div class="table-row ${rankClass}">
            <div class="rank-cell">
              ${trophy ? `<span class="trophy">${trophy}</span>` : ''}
              <span>${rank}</span>
            </div>
            <div class="player-cell">
              <img src="${player.avatar}" class="avatar" alt="${player.username}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(player.username)}&background=random'">
              <div class="username">${escapeHtml(player.username)}</div>
            </div>
            <div class="points-cell">${player.points}</div>
            <div class="wins-cell">${correctGuesses} ${plural}</div>
          </div>
        `;
      }).join('');
    }

    function updateStats(players, predictions, lastUpdate) {
      document.getElementById('totalPlayers').textContent = players;
      document.getElementById('totalPredictions').textContent = predictions;
      document.getElementById('lastUpdate').textContent = lastUpdate;
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return '-';

      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;

      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;

      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d ago`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Poll for updates every 2 seconds
    setInterval(loadLeaderboard, 2000);
    loadLeaderboard();
  </script>
</body>
</html>
